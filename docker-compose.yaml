services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8080:8080"    
      - "50000:50000"
    environment:
      - TZ=America/Bogota
    volumes:
      - jenkins_data:/var/jenkins_home
    user: root
    networks:
      - CI-CD

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /home/edwardarroyave/CI-CD/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - CI-CD

networks:
  CI-CD:
    driver: bridge

volumes:
  jenkins_data:
  prometheus_data: